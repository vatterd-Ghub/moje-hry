/* ---------- input ---------- */

  KeyW: [0, 'u'], KeyA: [0, 'l'], KeyS: [0, 'd'], KeyD: [0, 'r'],
  ArrowUp: [1, 'u'], ArrowLeft: [1, 'l'], ArrowDown: [1, 'd'], ArrowRight: [1, 'r']
};
var KEYBOMB = { Space: 0, Enter: 1, NumpadEnter: 1 };
var held = [[], []], padPrev = {};
function advance() {
  if (performance.now() < lockUntil) return;
  audio();
  if (state === 'menu') {
    if (menuStage === 0) {
      if (menuSel === 1) { mode = 'multi'; startMatch(); }
      else { menuStage = 1; menuSel = 1; lockUntil = performance.now() + 150; }
    } else if (menuSel === 3) { menuBack(); lockUntil = performance.now() + 150; }
    else { mode = 'single'; diff = DIFF_KEYS[menuSel]; startMatch(); }
  }
  else if (state === 'match') { state = 'menu'; menuStage = 0; menuSel = 0; lockUntil = performance.now() + 300; }
  else if (state === 'round') { newRound(); state = 'play'; }
}
function toggleSound() { muted = !muted; if (!muted) tone(660, 0.12, 'triangle', 0.08); }
window.addEventListener('keydown', function (e) {
  var k = e.code, ch = (e.key || '').toLowerCase();
  if (ch === 'z') { e.preventDefault(); if (!e.repeat) toggleSound(); return; }
  if (KEYDIR[k] || KEYBOMB[k] !== undefined || k === 'KeyF') e.preventDefault();
  if (k === 'KeyF') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (x) {} return; }
  if (e.repeat) return;
  var confirmKey = (k === 'Enter' || k === 'NumpadEnter' || k === 'Space');
  if (state === 'menu') {
    if (k === 'ArrowUp' || k === 'KeyW') menuMove(-1);
    else if (k === 'ArrowDown' || k === 'KeyS') menuMove(1);
    else if (confirmKey) advance();
    else if ((k === 'Escape' || k === 'Backspace') && menuStage === 1) menuBack();
    return;
  }
  if (state !== 'play') {
    if (confirmKey) advance();
    else if (k === 'Escape' || k === 'Backspace') { state = 'menu'; menuStage = 0; menuSel = 0; lockUntil = performance.now() + 300; }
    return;
  }
  if (KEYDIR[k]) { var m = KEYDIR[k], s = held[m[0]]; if (s.indexOf(m[1]) < 0) s.push(m[1]); }
  if (KEYBOMB[k] !== undefined && players) players[mode === 'single' ? 0 : KEYBOMB[k]].bombReq = true;
});
window.addEventListener('keyup', function (e) {
  var m = KEYDIR[e.code]; if (!m) return;
  var s = held[m[0]], i = s.indexOf(m[1]); if (i > -1) s.splice(i, 1);
});
window.addEventListener('blur', function () { held = [[], []]; });
cv.addEventListener('pointerdown', function (ev) {
  try { window.focus(); cv.focus(); } catch (e) {}
  if (state === 'menu') {
    var r = cv.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * LW, py = (ev.clientY - r.top) / r.height * LH - HUD;
    for (var i = 0; i < menuCount(); i++) {
      var rc = menuRect(i);
      if (px > LW / 2 - 280 && px < LW / 2 + 280 && py > rc.y && py < rc.y + rc.h) { menuSel = i; advance(); return; }
    }
    return;
  }
  advance();
});

function pads() {
  var out = [];
  try { var l = navigator.getGamepads ? navigator.getGamepads() : []; for (var i = 0; i < l.length; i++) if (l[i] && l[i].connected && !/consumer control|touchpad|keyboard|mouse|remote|system control/i.test(l[i].id || '')) out.push(l[i]); } catch (e) {}
  return out;
}
var padDirPrev = {};
function readInput() {
  var ps = pads(), i, j;
  for (i = 0; i < ps.length && i < 2; i++) {
    var gm = ps[i], ay0 = gm.axes[1] || 0, bt = gm.buttons;
    var up = ay0 < -0.5 || !!(bt[12] && bt[12].pressed), dn = ay0 > 0.5 || !!(bt[13] && bt[13].pressed);
    if (state === 'menu') {
      if (up && !padDirPrev['u' + i]) menuMove(-1);
      if (dn && !padDirPrev['d' + i]) menuMove(1);
    }
    padDirPrev['u' + i] = up; padDirPrev['d' + i] = dn;
  }
  var count = mode === 'single' ? 1 : 2;
  for (i = 0; i < count; i++) {
    var dx = 0, dy = 0, s = held[i];
    if (mode === 'single' && !s.length) s = held[1];
    if (s.length) { var d = DIRS[s[s.length - 1]]; dx = d[0]; dy = d[1]; }
    var g = ps[i];
    if (g) {
      var ax = g.axes[0] || 0, ay = g.axes[1] || 0, gx = 0, gy = 0, b = g.buttons;
      if (Math.abs(ax) > 0.5 || Math.abs(ay) > 0.5) { if (Math.abs(ax) > Math.abs(ay)) gx = ax > 0 ? 1 : -1; else gy = ay > 0 ? 1 : -1; }
      if (b[12] && b[12].pressed) { gx = 0; gy = -1; } else if (b[13] && b[13].pressed) { gx = 0; gy = 1; }
      else if (b[14] && b[14].pressed) { gx = -1; gy = 0; } else if (b[15] && b[15].pressed) { gx = 1; gy = 0; }
      if (gx || gy) { dx = gx; dy = gy; }
      for (j = 0; j < Math.min(b.length, 10); j++) {
        var key = i + '_' + j, now = !!b[j].pressed;
        if (now && !padPrev[key]) {
          if (state !== 'play') advance();
          else if (j <= 3 && players) players[i].bombReq = true;
        }
        padPrev[key] = now;
      }
    }
    if (players && players[i]) players[i].input = { dx: dx, dy: dy };
  }
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawWall(px, py) {
  ctx.fillStyle = '#56657a'; ctx.fillRect(px, py, T, T);
  ctx.fillStyle = '#7e8ea6'; ctx.fillRect(px, py, T, 7); ctx.fillRect(px, py, 7, T);
  ctx.fillStyle = '#3b4859'; ctx.fillRect(px, py + T - 7, T, 7); ctx.fillRect(px + T - 7, py, 7, T);
  ctx.fillStyle = '#617189'; ctx.fillRect(px + 14, py + 14, T - 28, T - 28);
}
function drawBrick(px, py) {
  ctx.fillStyle = '#b9602f'; ctx.fillRect(px + 2, py + 2, T - 4, T - 4);
  ctx.strokeStyle = '#7a3a1b'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px + 2, py + T / 3); ctx.lineTo(px + T - 2, py + T / 3);
  ctx.moveTo(px + 2, py + 2 * T / 3); ctx.lineTo(px + T - 2, py + 2 * T / 3);
  ctx.moveTo(px + T / 2, py + 2); ctx.lineTo(px + T / 2, py + T / 3);
  ctx.moveTo(px + T / 4, py + T / 3); ctx.lineTo(px + T / 4, py + 2 * T / 3);
  ctx.moveTo(px + 3 * T / 4, py + T / 3); ctx.lineTo(px + 3 * T / 4, py + 2 * T / 3);
  ctx.moveTo(px + T / 2, py + 2 * T / 3); ctx.lineTo(px + T / 2, py + T - 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(px + 2, py + 2, T - 4, 4);
}
var ITEMCOL = { B: '#4aa8ff', D: '#ff8a3d', R: '#4fe08a' };
function drawItem(px, py, it) {
  var cx = px + T / 2, cy = py + T / 2, bob = Math.sin(time * 5 + px) * 2;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, cy + 20, 16, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = ITEMCOL[it]; ctx.beginPath(); ctx.arc(cx, cy + bob, 19, 0, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
  ctx.fillStyle = '#0b1118'; ctx.font = 'bold 22px ' + STACK_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(it, cx, cy + bob + 1);
}
function drawBomb(b) {
  var px = b.x * T, py = HUD + b.y * T, cx = px + T / 2, cy = py + T / 2 + 3;
  var fast = b.t < 0.8, s = 1 + 0.07 * Math.sin(time * (fast ? 24 : 9));
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, cy + 20, 20, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = fast && Math.floor(time * 14) % 2 ? '#7a1f1f' : '#141a22';
  ctx.beginPath(); ctx.arc(cx, cy, 21 * s, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(cx - 7, cy - 8, 5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx + 8, cy - 17 * s); ctx.quadraticCurveTo(cx + 15, cy - 27, cx + 9, cy - 31); ctx.stroke();
  ctx.fillStyle = Math.floor(time * 20) % 2 ? '#ffd23f' : '#ff8a1f';
  ctx.beginPath(); ctx.arc(cx + 9, cy - 32, 5, 0, 7); ctx.fill();
}
function drawFlame(f) {
  var px = f.x * T, py = HUD + f.y * T, k = Math.min(1, f.t / (FLAME_T * 0.6)), m = (1 - k) * 8;
  ctx.fillStyle = '#ff6a1a'; rr(px + 4 + m, py + 4 + m, T - 8 - 2 * m, T - 8 - 2 * m, 14); ctx.fill();
  ctx.fillStyle = '#ffc233'; rr(px + 14 + m, py + 14 + m, T - 28 - 2 * m, T - 28 - 2 * m, 10); ctx.fill();
  ctx.fillStyle = '#fff6c8'; rr(px + 24 + m, py + 24 + m, T - 48 - 2 * m, T - 48 - 2 * m, 6); ctx.fill();
}
function drawPlayer(p) {
  var cx = (p.x + 0.5) * T, cy = HUD + (p.y + 0.5) * T, moving = !!p.mv, bob = moving ? Math.sin(time * 20) * 2.5 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(cx, cy + 24, 20, 7, 0, 0, 7); ctx.fill();
  var st = moving ? Math.sin(time * 20) * 5 : 0;
  ctx.fillStyle = '#17202b';
  ctx.beginPath(); ctx.ellipse(cx - 10 + st, cy + 22, 8, 5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 10 - st, cy + 22, 8, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(cx, cy + 4 + bob, 22, 0, 7); ctx.fill();
  ctx.fillStyle = p.light; ctx.beginPath(); ctx.arc(cx - 7, cy - 2 + bob, 7, 0, 7); ctx.fill();
  var ox = p.face === 'l' ? -4 : p.face === 'r' ? 4 : 0, oy = p.face === 'u' ? -5 : p.face === 'd' ? 3 : 0;
  ctx.fillStyle = '#f5f9ff'; rr(cx - 14 + ox, cy - 8 + oy + bob, 28, 16, 7); ctx.fill();
  if (p.face !== 'u') {
    ctx.fillStyle = '#0b1118';
    ctx.beginPath(); ctx.arc(cx - 5 + ox, cy + oy + bob, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5 + ox, cy + oy + bob, 3, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy - 18 + bob); ctx.lineTo(cx, cy - 28 + bob); ctx.stroke();
  ctx.fillStyle = p.light; ctx.beginPath(); ctx.arc(cx, cy - 30 + bob, 5, 0, 7); ctx.fill();
}
function text(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + STACK_FONT; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function drawHud() {
  ctx.fillStyle = '#101923'; ctx.fillRect(0, 0, LW, HUD);
  ctx.fillStyle = '#1e2c3b'; ctx.fillRect(0, HUD - 3, LW, 3);
  players.forEach(function (p, i) {
    var left = i === 0, x0 = left ? 18 : LW - 18, al = left ? 'left' : 'right';
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(left ? x0 + 11 : x0 - 11, 24, 11, 0, 7); ctx.fill();
    text(pname(i), left ? x0 + 30 : x0 - 30, 31, 22, '#e8eef6', al);
    for (var w = 0; w < WIN_TARGET; w++) {
      var px = left ? x0 + 7 + w * 22 : x0 - 7 - w * 22;
      ctx.beginPath(); ctx.arc(px, 54, 7, 0, 7);
      if (w < p.wins) { ctx.fillStyle = '#ffd23f'; ctx.fill(); } else { ctx.strokeStyle = '#4b5b70'; ctx.lineWidth = 2; ctx.stroke(); }
    }
    var lvl = Math.max(1, Math.round((p.speed - 4.5) / 0.9) + 1);
    text('B ' + p.maxBombs + '   D ' + p.range + '   R ' + lvl, left ? x0 + WIN_TARGET * 22 + 14 : x0 - WIN_TARGET * 22 - 14, 60, 17, '#8ea0b5', al, '600');
  });
  var warn = roundTime > SUDDEN_AT - 3 && state === 'play';
  var sec = Math.floor(roundTime), mm = Math.floor(sec / 60), ss = ('0' + (sec % 60)).slice(-2);
  text(warn ? 'ZDI SE STAHUJÍ' : mm + ':' + ss, LW / 2, 44, warn ? 24 : 28, warn ? '#ff6a6a' : '#e8eef6', 'center');
  if (muted) text('ZVUK VYP (Z)', LW / 2, 64, 14, '#8ea0b5', 'center', '600');
}
function overlay(lines) {
  ctx.fillStyle = 'rgba(6,10,15,.82)'; ctx.fillRect(0, HUD, LW, LH - HUD);
  lines.forEach(function (l) { text(l[0], LW / 2, HUD + l[1], l[2], l[3] || '#e8eef6', 'center', l[4]); });
}
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  if (!grid) return;
  var x, y;
  for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) {
    var px = x * T, py = HUD + y * T;
    ctx.fillStyle = (x + y) % 2 ? '#1c2a37' : '#203040'; ctx.fillRect(px, py, T, T);
    if (grid[y][x] === 1) drawWall(px, py);
    else if (grid[y][x] === 2) drawBrick(px, py);
    else if (items[y][x]) drawItem(px, py, items[y][x]);
  }
  bombs.forEach(drawBomb);
  flames.forEach(drawFlame);
  players.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (p) { if (p.alive) drawPlayer(p); });
  drawHud();
  if (state === 'play' && intro > 0) {
    var n = Math.ceil(intro / 0.6);
    text(n > 0 ? String(n) : '', LW / 2, HUD + ROWS * T / 2 + 40, 120, 'rgba(255,255,255,.9)', 'center');
  }
  if (state === 'menu') {
    var np = pads().length;
    ctx.fillStyle = 'rgba(6,10,15,.88)'; ctx.fillRect(0, HUD, LW, LH - HUD);
    text('BOMBÍCI', LW / 2, HUD + 130, 84, '#ffd23f', 'center');
    text(menuStage === 0 ? 'Pokládej bomby, rozbíjej cihly a vyhoď soupeře do vzduchu.' : 'Vyber obtížnost soupeře', LW / 2, HUD + 180, 24, '#c7d3e3', 'center', '600');
    var menuItems = menuStage === 0
      ? [['Hra proti počítači', '1 hráč'], ['Hra dvou hráčů', 'multiplayer']]
      : [['Lehká', 'pomalý a opatrný soupeř'], ['Střední', 'vyvážený soupeř'], ['Těžká', 'rychlý a útočný soupeř'], ['Zpět', '']];
    for (var mi = 0; mi < menuItems.length; mi++) {
      var rc = menuRect(mi), by = HUD + rc.y, on = menuSel === mi, small = rc.h < 70;
      ctx.fillStyle = on ? '#ffd23f' : '#1b2735'; rr(LW / 2 - 280, by, 560, rc.h, 16); ctx.fill();
      if (!on) { ctx.strokeStyle = '#33475f'; ctx.lineWidth = 2; ctx.stroke(); }
      if (small) { text('‹ ' + menuItems[mi][0], LW / 2, by + 36, 24, on ? '#0b1118' : '#e8eef6', 'center'); }
      else {
        text(menuItems[mi][0], LW / 2, by + 36, 32, on ? '#0b1118' : '#e8eef6', 'center');
        text(menuItems[mi][1], LW / 2, by + 62, 18, on ? '#3a3417' : '#8ea0b5', 'center', '600');
      }
    }
    if (menuStage === 0) {
      if (menuSel === 0) {
        text('Ty (modrý): W A S D nebo šipky · bomba mezerník nebo Enter · nebo gamepad', LW / 2, HUD + 470, 22, '#35c8ff', 'center', '600');
        text('Soupeř (červený): počítač', LW / 2, HUD + 504, 22, '#ff5d73', 'center', '600');
      } else {
        text('Hráč 1 (modrý): W A S D · bomba mezerník · nebo gamepad 1', LW / 2, HUD + 470, 22, '#35c8ff', 'center', '600');
        text('Hráč 2 (červený): šipky · bomba Enter · nebo gamepad 2 / ovladač TV', LW / 2, HUD + 504, 22, '#ff5d73', 'center', '600');
      }
      text('Bonusy:  B více bomb   D delší výbuch   R rychlost   ·   první na ' + WIN_TARGET + ' výhry', LW / 2, HUD + 552, 20, '#c7d3e3', 'center', '600');
    }
    text('Nahoru / dolů: výběr  ·  Enter nebo tlačítko: potvrdit', LW / 2, HUD + 628, 28, '#ffd23f', 'center');
    text('Z: zvuk ' + (muted ? 'vypnutý' : 'zapnutý') + '  ·  F: celá obrazovka  ·  gamepady: ' + np, LW / 2, HUD + 692, 18, '#8ea0b5', 'center', '600');
  } else if (state === 'round' || state === 'match') {
    var who = lastWinner ? pnameShort(lastWinner.id) : null;
    overlay([
      [state === 'match' ? who + ' vyhrál zápas!' : (who ? 'Kolo vyhrává ' + who : 'Remíza'), 330, 64, lastWinner ? lastWinner.color : '#e8eef6'],
      ['Skóre  ' + players[0].wins + ' : ' + players[1].wins, 400, 40, '#e8eef6'],
      [state === 'match' ? 'Enter nebo tlačítko: zpět do menu' : 'Enter nebo tlačítko: další kolo', 500, 28, '#ffd23f']
    ]);
  }
}

/* ---------- loop ---------- */
var last = performance.now();
var msgEl = document.getElementById('msg');
function frame(now) {
  if (msgEl) { msgEl.parentNode.removeChild(msgEl); msgEl = null; }
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  readInput(); update(dt); draw();
  requestAnimationFrame(frame);
}
fit(); newRound(); intro = 0; state = 'menu';
window.__dbg = function () { return { state: state, players: players, bombs: bombs.length, flames: flames.length, grid: grid, mode: mode, muted: muted, diff: diff, stage: menuStage, sel: menuSel }; };
try { cv.focus(); } catch (e) {}
requestAnimationFrame(frame);
})();
