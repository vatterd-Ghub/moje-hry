<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test ovladače</title>
<style>
html,body{margin:0;background:#0d1230;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:16px;font-size:22px}
h1{margin:0 0 8px;font-size:30px}
.box{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;margin:10px 0;min-height:30px;word-wrap:break-word}
.ok{color:#6aff8a}.no{color:#ff8a8a}
a{color:#ffe14a}
</style></head><body>
<h1>Test ovladače</h1>
<div>Zmáčkni tlačítka a pohni páčkami. Co se zobrazí, to prohlížeč opravdu vidí.</div>
<div class="box" id="gp">Gamepad: čekám… (zmáčkni libovolné tlačítko)</div>
<div class="box" id="kb">Klávesy: zatím nic</div>
<div class="box" id="ms">Myš: zatím nic</div>
<a href="../index.html" style="font-size:20px">← zpět do menu</a>
<script>
var $=function(i){return document.getElementById(i)};
var nKey=0,nMouse=0;
document.addEventListener('keydown',function(e){nKey++;$('kb').innerHTML='Klávesy: <span class="ok">přicházejí</span> · poslední: key="'+e.key+'" code="'+e.code+'" ('+nKey+'×)';e.preventDefault()});
document.addEventListener('mousemove',function(e){nMouse++;$('ms').innerHTML='Myš: pohyb '+nMouse+'× · x='+e.clientX+' y='+e.clientY});
document.addEventListener('mousedown',function(e){$('ms').innerHTML+=' · klik (tlačítko '+e.button+')'});
function poll(){
  var l=[];try{l=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}
  var t='',found=0;
  for(var i=0;i<l.length;i++){var g=l[i];if(!g)continue;found++;
    var b=[],a=[];for(var j=0;j<g.buttons.length;j++)if(g.buttons[j].pressed)b.push(j);
    for(j=0;j<g.axes.length;j++)a.push(g.axes[j].toFixed(1));
    var skip=/consumer control|touchpad|keyboard|mouse|remote|system control/i.test(g.id);t+='<span class="'+(skip?'no':'ok')+'">Gamepad '+i+(skip?' (hra ho ignoruje):':' (hra ho použije):')+'</span> '+g.id+'<br>tlačítka: '+(b.join(', ')||'žádné')+'<br>osy: '+a.join(' / ')+'<br>'}
  $('gp').innerHTML=found?t:'Gamepad: <span class="no">prohlížeč žádný gamepad nevidí</span> (zmáčkni tlačítko; pokud se nic neukáže, ovladač se prohlížeči hlásí jako myš/klávesnice)';
  requestAnimationFrame(poll)}
poll();
</script></body></html>
