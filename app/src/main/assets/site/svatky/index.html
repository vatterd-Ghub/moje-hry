<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kalendář svátků</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout: one column app. Hero card with today's name day, month grid / list below, name search on top. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #14213d;
  --muted: #5d6b86;
  --line: #dde3ee;
  --accent: #1f4fd8;
  --accent-ink: #ffffff;
  --holiday: #c8283b;
  --today: #fff3c4;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #171f35; --ink: #e8edf8; --muted: #9aa8c6; --line: #2a3555;
    --accent: #7ea2ff; --accent-ink: #0e1424; --holiday: #ff7a88; --today: #3a3417;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #171f35; --ink: #e8edf8; --muted: #9aa8c6; --line: #2a3555;
  --accent: #7ea2ff; --accent-ink: #0e1424; --holiday: #ff7a88; --today: #3a3417;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--text);
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
.today { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 18px 18px 16px; }
.today .when { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.today h1 { font-size: 34px; line-height: 1.1; margin: 6px 0 4px; }
.today .next { font-size: 14px; opacity: .9; }
.search { display: flex; flex-direction: column; gap: 6px; }
.search input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.search input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.results { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.results[hidden] { display: none; }
.results button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; font: inherit; color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
.results li:last-child button { border-bottom: 0; }
.results .d { color: var(--muted); white-space: nowrap; }
.results .none { padding: 11px 14px; color: var(--muted); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar h2 { font-size: 22px; flex: 1; text-align: center; }
.btn { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; min-width: 44px; height: 44px; font: inherit; cursor: pointer; padding: 0 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; gap: 8px; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 2px 0; }
.dow.we { color: var(--holiday); }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 62px; padding: 5px 4px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.cell.empty { background: transparent; border-color: transparent; cursor: default; }
.cell .n { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.cell .nm { font-size: 10px; line-height: 1.15; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cell.red .n, .row.red .n, .row.red .wd { color: var(--holiday); }
.cell.is-today, .row.is-today { background: var(--today); border-color: var(--accent); }
.cell.sel, .row.sel { outline: 2px solid var(--accent); }
.list { display: flex; flex-direction: column; gap: 4px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 34px 28px 1fr; gap: 8px; align-items: baseline; text-align: left; font: inherit; color: var(--ink); width: 100%; cursor: pointer; }
.row .n { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.row .wd { color: var(--muted); font-size: 12px; text-transform: uppercase; }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.detail .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.detail .v { font-family: var(--display); font-size: 24px; margin: 2px 0; }
.detail .h { color: var(--holiday); font-weight: 600; }
.foot { color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .btn, .cell, .row { transition: background .15s; } }
</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;600&display=swap">

<main>
  <section class="today" aria-live="polite">
    <div class="when" id="tWhen"></div>
    <h1 id="tName"></h1>
    <div class="next" id="tNext"></div>
  </section>

  <div class="search">
    <input id="q" type="search" placeholder="Najít jméno, např. Tereza" autocomplete="off" aria-label="Hledat jméno">
    <ul class="results" id="res" hidden></ul>
  </div>

  <div class="bar">
    <button class="btn" id="prev" aria-label="Předchozí měsíc">‹</button>
    <h2 id="title"></h2>
    <button class="btn" id="next" aria-label="Další měsíc">›</button>
  </div>
  <div class="tools">
    <button class="btn" id="goToday">Dnes</button>
    <button class="btn" id="viewBtn" aria-pressed="false">Seznam</button>
  </div>

  <div id="view"></div>
  <section class="detail" id="detail" aria-live="polite"></section>
  <p class="foot">Jména podle českého kalendáře. Červeně jsou státní svátky a dny pracovního klidu. Velikonoce se počítají automaticky.</p>
</main>

<script>
/* Jména v kalendáři: pole měsíců, v každém jména po dnech. */
var NAMES = [
["Nový rok","Karina","Radmila","Diana","Dalimil","Tři králové","Vilma","Čestmír","Vladan","Břetislav","Bohdana","Pravoslav","Edita","Radovan","Alice","Ctirad","Drahoslav","Vladislav","Doubravka","Ilona","Běla","Slavomír","Zdeněk","Milena","Miloš","Zora","Ingrid","Otýlie","Zdislava","Robin","Marika"],
["Hynek","Nela","Blažej","Jarmila","Dobromila","Vanda","Veronika","Milada","Apolena","Mojmír","Božena","Slavěna","Věnceslav","Valentýn","Jiřina","Ljuba","Miloslava","Gizela","Patrik","Oldřich","Lenka","Petr","Svatopluk","Matěj","Liliana","Dorota","Alexandr","Lumír","Horymír"],
["Bedřich","Anežka","Kamil","Stela","Kazimír","Miroslav","Tomáš","Gabriela","Františka","Viktorie","Anděla","Řehoř","Růžena","Rút/Matylda","Ida","Elena/Herbert","Vlastimil","Eduard","Josef","Světlana","Radek","Leona","Ivona","Gabriel","Marián","Emanuel","Dita","Soňa","Taťána","Arnošt","Kvido"],
["Hugo","Erika","Richard","Ivana","Miroslava","Vendula","Heřman/Hermína","Ema","Dušan","Darja","Izabela","Julius","Aleš","Vincenc","Anastázie","Irena","Rudolf","Valérie","Rostislav","Marcela","Alexandra","Evženie","Vojtěch","Jiří","Marek","Oto","Jaroslav","Vlastislav","Robert","Blahoslav"],
["Svátek práce","Zikmund","Alexej","Květoslav","Klaudie","Radoslav","Stanislav","Den vítězství","Ctibor","Blažena","Svatava","Pankrác","Servác","Bonifác","Žofie","Přemysl","Aneta","Nataša","Ivo","Zbyšek","Monika","Emil","Vladimír","Jana","Viola","Filip","Valdemar","Vilém","Maxmilián","Ferdinand","Kamila"],
["Laura","Jarmil","Tamara","Dalibor","Dobroslav","Norbert","Iveta/Slavoj","Medard","Stanislava","Gita","Bruno","Antonie","Antonín","Roland","Vít","Zbyněk","Adolf","Milan","Leoš","Květa","Alois","Pavla","Zdeňka","Jan","Ivan","Adriana","Ladislav","Lubomír","Petr a Pavel","Šárka"],
["Jaroslava","Patricie","Radomír","Prokop","Cyril a Metoděj","Mistr Jan Hus","Bohuslava","Nora","Drahoslava","Libuše/Amálie","Olga","Bořek","Markéta","Karolína","Jindřich","Luboš","Martina","Drahomíra","Čeněk","Ilja","Vítězslav","Magdaléna","Libor","Kristýna","Jakub","Anna","Věroslav","Viktor","Marta","Bořivoj","Ignác"],
["Oskar","Gustav","Miluše","Dominik","Kristián","Oldřiška","Lada","Soběslav","Roman","Vavřinec","Zuzana","Klára","Alena","Alan","Hana","Jáchym","Petra","Helena","Ludvík","Bernard","Johana","Bohuslav","Sandra","Bartoloměj","Radim","Luděk","Otakar","Augustin","Evelína","Vladěna","Pavlína"],
["Linda/Samuel","Adéla","Bronislav","Jindřiška","Boris","Boleslav","Regína","Mariana","Daniela","Irma","Denisa","Marie","Lubor","Radka","Jolana","Ludmila","Naděžda","Kryštof","Zita","Oleg","Matouš","Darina","Berta","Jaromír","Zlata","Andrea","Jonáš","Václav","Michal","Jeroným"],
["Igor","Olívie/Oliver","Bohumil","František","Eliška","Hanuš","Justýna","Věra","Štefan/Sára","Marina","Andrej","Marcel","Renáta","Agáta","Tereza","Havel","Hedvika","Lukáš","Michaela","Vendelín","Brigita","Sabina","Teodor","Nina","Beáta","Erik","Šarlota/Zoe","Státní svátek","Silvie","Tadeáš","Štěpánka"],
["Felix","Tobiáš","Hubert","Karel","Miriam","Liběna","Saskie","Bohumír","Bohdan","Evžen","Martin","Benedikt","Tibor","Sáva","Leopold","Otmar","Mahulena","Romana","Alžběta","Nikola","Albert","Cecílie","Klement","Emílie","Kateřina","Artur","Xenie","René","Zina","Ondřej"],
["Iva","Blanka","Svatoslav","Barbora","Jitka","Mikuláš","Ambrož/Benjamín","Květoslava","Vratislav","Julie","Dana","Simona","Lucie","Lýdie","Radana/Radan","Albína","Daniel","Miloslav","Ester","Dagmar","Natálie","Šimon","Vlasta","Adam a Eva","1. svátek vánoční","Štěpán","Žaneta","Bohumila","Judita","David","Silvestr"]
];
var MONTHS = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
var MONTHS_GEN = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
var DOW = ["Po","Út","St","Čt","Pá","So","Ne"];
var DOW_LONG = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
var FIXED_HOL = ["0-1","4-1","4-8","6-5","6-6","8-28","9-28","10-17","11-24","11-25","11-26"];

function easter(y) { // Meeus/Jones/Butcher
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
      g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      month=Math.floor((h+l-7*m+114)/31)-1,day=((h+l-7*m+114)%31)+1;
  return new Date(y,month,day);
}
function isHoliday(y,m,d) {
  if (FIXED_HOL.indexOf(m+"-"+d) > -1) return true;
  var e = easter(y), mon = new Date(e.getFullYear(), e.getMonth(), e.getDate()+1), fri = new Date(e.getFullYear(), e.getMonth(), e.getDate()-2);
  return (m===mon.getMonth() && d===mon.getDate()) || (m===fri.getMonth() && d===fri.getDate());
}
function nameOf(m,d) { var a = NAMES[m]; return a && a[d-1] ? a[d-1] : ""; }
function daysIn(y,m) { return new Date(y,m+1,0).getDate(); }
function strip(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }

var now = new Date();
var cur = { y: now.getFullYear(), m: now.getMonth() };
var sel = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
var listView = false;
try { listView = localStorage.getItem("svatky-list") === "1"; } catch (e) {}

function $(id) { return document.getElementById(id); }
function same(a,b) { return a.y===b.y && a.m===b.m && a.d===b.d; }
var todayObj = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };

function renderToday() {
  var wd = DOW_LONG[now.getDay()];
  $("tWhen").textContent = "Dnes · " + wd + " " + now.getDate() + ". " + MONTHS_GEN[now.getMonth()] + " " + now.getFullYear();
  $("tName").textContent = nameOf(now.getMonth(), now.getDate()).replace(/\//g," / ");
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  $("tNext").textContent = "Zítra: " + nameOf(t.getMonth(), t.getDate()).replace(/\//g," / ");
}

function renderMonth() {
  $("title").textContent = MONTHS[cur.m] + " " + cur.y;
  var first = new Date(cur.y, cur.m, 1), offset = (first.getDay()+6)%7, n = daysIn(cur.y, cur.m);
  var html = "";
  if (!listView) {
    html += '<div class="grid" role="grid">';
    for (var i=0;i<7;i++) html += '<div class="dow'+(i>4?' we':'')+'">'+DOW[i]+'</div>';
    for (var e=0;e<offset;e++) html += '<div class="cell empty" aria-hidden="true"></div>';
    for (var d=1; d<=n; d++) {
      var dt = {y:cur.y,m:cur.m,d:d}, wdx = (offset+d-1)%7;
      var cls = "cell" + ((wdx>=5||isHoliday(cur.y,cur.m,d))?" red":"") + (same(dt,todayObj)?" is-today":"") + (same(dt,sel)?" sel":"");
      html += '<button class="'+cls+'" data-d="'+d+'"><span class="n">'+d+'</span><span class="nm">'+nameOf(cur.m,d).replace(/\//g," / ")+'</span></button>';
    }
    html += '</div>';
  } else {
    html += '<div class="list">';
    for (var d2=1; d2<=n; d2++) {
      var dt2 = {y:cur.y,m:cur.m,d:d2}, w2 = (offset+d2-1)%7;
      var c2 = "row" + ((w2>=5||isHoliday(cur.y,cur.m,d2))?" red":"") + (same(dt2,todayObj)?" is-today":"") + (same(dt2,sel)?" sel":"");
      html += '<button class="'+c2+'" data-d="'+d2+'"><span class="n">'+d2+'.</span><span class="wd">'+DOW[w2]+'</span><span>'+nameOf(cur.m,d2).replace(/\//g," / ")+'</span></button>';
    }
    html += '</div>';
  }
  $("view").innerHTML = html;
  $("viewBtn").textContent = listView ? "Mřížka" : "Seznam";
  $("viewBtn").setAttribute("aria-pressed", listView ? "true" : "false");
}

function renderDetail() {
  var dt = new Date(sel.y, sel.m, sel.d), hol = isHoliday(sel.y, sel.m, sel.d), we = dt.getDay()===0 || dt.getDay()===6;
  var h = '<div class="k">' + DOW_LONG[dt.getDay()] + ' ' + sel.d + '. ' + MONTHS_GEN[sel.m] + ' ' + sel.y + '</div>';
  h += '<div class="v">' + nameOf(sel.m, sel.d).replace(/\//g," / ") + '</div>';
  if (hol) h += '<div class="h">Státní svátek, den pracovního klidu</div>';
  else if (we) h += '<div class="foot">Víkend</div>';
  $("detail").innerHTML = h;
}

function renderAll() { renderToday(); renderMonth(); renderDetail(); }

$("view").addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-d]"); if (!b) return;
  sel = { y: cur.y, m: cur.m, d: +b.getAttribute("data-d") };
  renderMonth(); renderDetail();
});
$("prev").onclick = function () { cur.m--; if (cur.m<0) { cur.m=11; cur.y--; } renderMonth(); };
$("next").onclick = function () { cur.m++; if (cur.m>11) { cur.m=0; cur.y++; } renderMonth(); };
$("goToday").onclick = function () { cur = { y: todayObj.y, m: todayObj.m }; sel = { y: todayObj.y, m: todayObj.m, d: todayObj.d }; renderMonth(); renderDetail(); };
$("viewBtn").onclick = function () {
  listView = !listView;
  try { localStorage.setItem("svatky-list", listView ? "1" : "0"); } catch (e) {}
  renderMonth();
};

$("q").addEventListener("input", function () {
  var q = strip(this.value.trim()), res = $("res");
  if (q.length < 2) { res.hidden = true; res.innerHTML = ""; return; }
  var out = [];
  for (var m=0;m<12;m++) for (var d=1; d<=NAMES[m].length; d++) {
    var parts = NAMES[m][d-1].split("/");
    for (var p=0;p<parts.length;p++) if (strip(parts[p]).indexOf(q) > -1) { out.push({m:m,d:d,name:parts[p]}); break; }
  }
  res.hidden = false;
  if (!out.length) { res.innerHTML = '<li class="none">Takové jméno v kalendáři není.</li>'; return; }
  res.innerHTML = out.slice(0,8).map(function (r) {
    return '<li><button data-m="'+r.m+'" data-d="'+r.d+'"><span>'+r.name+'</span><span class="d">'+r.d+'. '+MONTHS_GEN[r.m]+'</span></button></li>';
  }).join("");
});
$("res").addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  var m = +b.getAttribute("data-m"), d = +b.getAttribute("data-d");
  cur = { y: cur.y, m: m }; sel = { y: cur.y, m: m, d: d };
  $("res").hidden = true; $("q").value = "";
  renderMonth(); renderDetail();
});

renderAll();
</script>
