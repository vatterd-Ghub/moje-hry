name: Sestavit APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Přejmenovat
        run: cp app/build/outputs/apk/debug/app-debug.apk moje-hry.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moje-hry-apk
          path: moje-hry.apk
      - name: Vydání (Release) s APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Moje hry ${{ github.run_number }}
          files: moje-hry.apk

